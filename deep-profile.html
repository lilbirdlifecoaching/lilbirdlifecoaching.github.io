<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lil' Bird Deep Profile — Know yourself. Find your people.</title>
<meta name="description" content="A conversational assessment that discovers who you actually are — through your stories, not multiple choice questions.">
<link rel="icon" href="bird-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/">
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const WORKER_URL = 'https://lilbird-assessment.cwwq46sn7m.workers.dev';
const STRIPE_PK  = 'pk_live_51QSMYQGAu36WZ7DdlsoNqzwPnsf4HUoOj6F1NZAeGnnH1TPjDEdEQudXIGgTLaUq079aQMI1W2MS6UpMItmTjgxy00HbouBx2g';
const SHEETS_URL = ''; // Paste Apps Script URL here after setup

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let selectedAmount = 12;
let stripeInstance = null;
let cardElement    = null;
let nestId         = null;
let hasRetake      = false;
let profileData    = null;

// ═══════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════
(function spawnParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay    = (Math.random() * 10) + 's';
    p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
    p.style.background = Math.random() > 0.5 ? '#F5C842' : '#e8734a';
    container.appendChild(p);
  }
})();

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(screenId);
  if (target) {
    target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Init Stripe when pay screen appears
  if (screenId === 'screen-pay' && !stripeInstance) {
    initStripe();
  }

  // Run analysis when landing screen appears
  if (screenId === 'screen-landing') {
    runAnalysis();
  }
  // Populate snapshot when shown
  if (screenId === 'screen-snapshot' && profileData) {
    populateSnapshot(profileData);
  }
}

function reflectAndGo(nextScreen, inputId, pillId) {
  const val = document.getElementById(inputId)?.value?.trim() || '';
  if (val.length > 3) {
    const words = val.split(' ').slice(0, 10).join(' ');
    const pill  = document.getElementById(pillId);
    if (pill) {
      pill.textContent = '"' + words + (val.split(' ').length > 10 ? '..."' : '"');
      pill.style.display = 'inline-block';
    }
  }
  goTo(nextScreen);
}

// ═══════════════════════════════════════════════
// PAYMENT — AMOUNT SELECTION
// ═══════════════════════════════════════════════
function selectAmount(amount, el) {
  selectedAmount = amount;
  document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

// ═══════════════════════════════════════════════
// STRIPE INIT
// ═══════════════════════════════════════════════
function initStripe() {
  stripeInstance = Stripe(STRIPE_PK);
  const elements = stripeInstance.elements({
    appearance: {
      theme: 'night',
      variables: {
        colorPrimary: '#F5C842',
        colorBackground: '#2d3040',
        colorText: '#f0ece4',
        colorDanger: '#e8734a',
        fontFamily: 'DM Sans, sans-serif',
        borderRadius: '10px',
      }
    }
  });
  cardElement = elements.create('card', {
    style: {
      base: {
        color: '#f0ece4',
        fontFamily: 'DM Sans, sans-serif',
        fontSize: '15px',
        fontWeight: '300',
        '::placeholder': { color: 'rgba(240,236,228,0.35)' }
      }
    }
  });
  cardElement.mount('#card-element');
  cardElement.on('change', evt => {
    document.getElementById('card-errors').textContent = evt.error ? evt.error.message : '';
  });
}

// ═══════════════════════════════════════════════
// PROCESS PAYMENT
// ═══════════════════════════════════════════════
async function processPayment() {
  const btn = document.getElementById('payButton');
  const processing = document.getElementById('payProcessing');
  const errBox = document.getElementById('payError');

  btn.style.display = 'none';
  processing.style.display = 'flex';
  errBox.style.display = 'none';

  try {
    // 1. Create PaymentIntent via Worker
    const intentRes = await fetch(`${WORKER_URL}/create-payment-intent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: selectedAmount * 100, nestId })
    });

    if (!intentRes.ok) throw new Error('Payment setup failed. Please try again.');
    const { clientSecret } = await intentRes.json();

    // 2. Confirm payment with Stripe
    const { error, paymentIntent } = await stripeInstance.confirmCardPayment(clientSecret, {
      payment_method: { card: cardElement }
    });

    if (error) throw new Error(error.message);
    if (paymentIntent.status !== 'succeeded') throw new Error('Payment did not complete. Please try again.');

    // 3. Log to Google Sheet
    if (SHEETS_URL && profileData) {
      logToSheet(profileData, selectedAmount, collectResponses());
    }

    // 4. Show results
    renderResults(profileData);
    goTo('screen-results');

  } catch (err) {
    errBox.textContent = err.message || 'Something went wrong. Please try again.';
    errBox.style.display = 'block';
    btn.style.display = 'flex';
    processing.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════
// COLLECT RESPONSES
// ═══════════════════════════════════════════════
function collectResponses() {
  return {
    ch1a: document.getElementById('c1a')?.value?.trim() || '',
    ch1b: document.getElementById('c1b')?.value?.trim() || '',
    ch1c: document.getElementById('c1c')?.value?.trim() || '',
    ch2a: document.getElementById('c2a')?.value?.trim() || '',
    ch2b: document.getElementById('c2b')?.value?.trim() || '',
    ch2c: document.getElementById('c2c')?.value?.trim() || '',
    ch3a: document.getElementById('c3a')?.value?.trim() || '',
    ch3b: document.getElementById('c3b')?.value?.trim() || '',
    ch3c: document.getElementById('c3c')?.value?.trim() || '',
    ch4a: document.getElementById('c4a')?.value?.trim() || '',
    ch4b: document.getElementById('c4b')?.value?.trim() || '',
    ch5a: document.getElementById('c5a')?.value?.trim() || '',
    ch5b: document.getElementById('c5b')?.value?.trim() || '',
    ch5c: document.getElementById('c5c')?.value?.trim() || '',
    ch6a: document.getElementById('c6a')?.value?.trim() || '',
    ch6b: document.getElementById('c6b')?.value?.trim() || '',
    ch6c: document.getElementById('c6c')?.value?.trim() || '',
  };
}

// ═══════════════════════════════════════════════
// RUN AI ANALYSIS (called at landing screen)
// ═══════════════════════════════════════════════
async function runAnalysis() {
  const responses = collectResponses();
  nestId = generateNestId();
  document.getElementById('nest-id').textContent = nestId;

  // Show loading overlay during AI processing
  document.getElementById('loadingOverlay').classList.add('active');

  try {
    const res = await fetch(`${WORKER_URL}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ responses, nestId })
    });

    if (!res.ok) throw new Error('Analysis failed');
    profileData = await res.json();

    // Store in KV via worker (results only, no raw responses)
    await fetch(`${WORKER_URL}/store-profile`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nestId, profile: profileData })
    });

  } catch (err) {
    console.error('Analysis error:', err);
    // Fallback: use a sensible default profile structure
    profileData = getFallbackProfile();
  }

  document.getElementById('loadingOverlay').classList.remove('active');
}

// ═══════════════════════════════════════════════
// RENDER RESULTS
// ═══════════════════════════════════════════════
function renderResults(profile) {
  if (!profile) return;

  // Header
  document.getElementById('result-archetype').textContent = profile.archetype || 'The Connector';
  document.getElementById('result-archetype-sub').textContent = profile.archetypeSub || '';

  // Tags
  const tags = document.getElementById('result-tags');
  tags.innerHTML = '';
  if (profile.mbti) tags.innerHTML += `<span class="ftag gold">${profile.mbti}</span>`;
  if (profile.enneagram) tags.innerHTML += `<span class="ftag ember">${profile.enneagram}</span>`;
  if (profile.attachment) tags.innerHTML += `<span class="ftag">${profile.attachment}</span>`;

  // Sections
  setSection('result-who', profile.whoYouAre);
  setSection('result-wired', profile.howWired);
  setSection('result-attachment', profile.attachmentDetail);
  setSection('result-remember', profile.thingsToRemember);
  setSection('result-stuck', profile.stuckPlaces);

  if (profile.wing) {
    document.getElementById('result-wing-title').textContent = profile.wingTitle || 'Your wing';
    setSection('result-wing', profile.wing);
  }

  // Quote
  if (profile.quote) {
    document.querySelector('#result-quote blockquote').textContent = `"${profile.quote}"`;
  }

  // Nest ID in URL
  if (nestId) {
    const url = new URL(window.location);
    url.searchParams.set('nest', nestId);
    window.history.replaceState({}, '', url);
  }
}

function setSection(id, content) {
  const el = document.getElementById(id);
  if (!el || !content) return;
  if (typeof content === 'string') {
    el.innerHTML = `<p>${content.replace(/\n\n/g, '</p><p>')}</p>`;
  }
}

// ═══════════════════════════════════════════════
// GOOGLE SHEETS LOGGING
// ═══════════════════════════════════════════════
function logToSheet(profile, amount, responses) {
  if (!SHEETS_URL) return;
  fetch(SHEETS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nestId,
      timestamp: new Date().toISOString(),
      archetype: profile.archetype || '',
      mbti: profile.mbti || '',
      enneagram: profile.enneagram || '',
      attachment: profile.attachment || '',
      amount: amount || 0,
      // Raw answers as safety backup
      answers: responses ? JSON.stringify(responses) : '',
    })
  }).catch(() => {}); // Silent fail — don't block UX
}

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════
function generateNestId() {
  return 'nest-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

function restartAssessment() {
  if (hasRetake) {
    alert('You have already used your free retake. Email hello@lilbird.life if you need help.');
    return;
  }
  hasRetake = true;
  document.querySelectorAll('textarea').forEach(t => t.value = '');
  document.querySelectorAll('.reflect-pill').forEach(p => { p.textContent = ''; p.style.display = 'none'; });
  goTo('screen-c1a');
}

  return {

    mbti: 'ENFJ',
    enneagram: 'Enneagram 2w3',

// ═══════════════════════════════════════════════
// LOAD EXISTING PROFILE (if ?nest= in URL)
// ═══════════════════════════════════════════════
// TEST MODE — add ?testpay=1 to URL to skip to payment (remove before final launch)
window.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("testpay") === "1") {
    nestId = generateNestId();
    profileData = getFallbackProfile();
    document.getElementById("nest-id").textContent = nestId;
    initStripe();
    populateSnapshot(profileData);
    goTo("screen-snapshot");
  }
});

(async function checkExistingProfile() {
  const params = new URLSearchParams(window.location.search);
  const existingNest = params.get('nest');
  if (!existingNest) return;

  try {
    const res = await fetch(`${WORKER_URL}/get-profile?nestId=${existingNest}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.profile) {
      nestId = existingNest;
      profileData = data.profile;
      document.getElementById('nest-id').textContent = nestId;
      renderResults(profileData);
      goTo('screen-results');
    }
  } catch (e) {
    // No existing profile found, start fresh
  }
})();

// ═══════════════════════════════════════════════
// BEEHIIV CONFIG
// ═══════════════════════════════════════════════
const BEEHIIV_PUB_ID = '53a4cafc-9b30-41d5-bd5e-4dc0026b4308';

// ═══════════════════════════════════════════════
// POPULATE SNAPSHOT SCREEN
// ═══════════════════════════════════════════════
function populateSnapshot(profile) {
  if (!profile) return;

  // MBTI badge
  const mbtiEl = document.getElementById('snap-mbti');
  if (mbtiEl && profile.mbti) mbtiEl.textContent = profile.mbti;

  // Archetype
  const archEl = document.getElementById('snap-archetype');
  if (archEl) {
    archEl.textContent = (profile.archetype || 'Your Type') +
      (profile.archetypeSub ? ' — ' + profile.archetypeSub : '');
  }

  // Preview — first 2 paragraphs of whoYouAre
  const previewEl = document.getElementById('snap-preview');
  if (previewEl && profile.whoYouAre) {
    const paras = profile.whoYouAre.split(/\n\n/).slice(0, 2);
    previewEl.innerHTML = paras.map(p => `<p>${p}</p>`).join('');
  }
}

// ═══════════════════════════════════════════════
// SUBMIT EMAIL → BEEHIIV
// ═══════════════════════════════════════════════
async function submitEmail() {
  const emailEl = document.getElementById('snap-email');
  const errorEl = document.getElementById('email-error');
  const submittedEl = document.getElementById('email-submitted');
  const email = emailEl ? emailEl.value.trim() : '';

  // Validate
  if (!email || !email.includes('@') || !email.includes('.')) {
    if (errorEl) { errorEl.style.display = 'block'; }
    return;
  }
  if (errorEl) errorEl.style.display = 'none';

  // Disable input during submit
  if (emailEl) emailEl.disabled = true;

  try {
    await fetch('https://api.beehiiv.com/v2/publications/' + BEEHIIV_PUB_ID + '/subscriptions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        reactivate_existing: true,
        send_welcome_email: true,
        custom_fields: [
          { name: 'archetype',   value: profileData?.archetype   || '' },
          { name: 'mbti',        value: profileData?.mbti        || '' },
          { name: 'enneagram',   value: profileData?.enneagram   || '' },
          { name: 'attachment',  value: profileData?.attachment  || '' },
          { name: 'nest_id',     value: nestId                   || '' },
          { name: 'source',      value: 'deep-profile-snapshot'        },
        ]
      })
    });
  } catch (e) {
    // Silent fail — don't block the experience
    console.warn('Beehiiv error:', e);
  }

  // Show confirmation regardless
  if (submittedEl) submittedEl.style.display = 'block';
  if (emailEl) emailEl.closest('.email-row').style.display = 'none';
}

// ═══════════════════════════════════════════════
// OVERRIDE goTo to populate snapshot when shown
// ═══════════════════════════════════════════════
const _originalGoTo = goTo;
goTo = function(screenId) {
  _originalGoTo(screenId);
  if (screenId === 'screen-snapshot' && profileData) {
    populateSnapshot(profileData);
  }
};

</script>
</body>
</html>
