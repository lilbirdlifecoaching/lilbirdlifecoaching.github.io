<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Glow Map · lil' bird</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark: #1e2028; --dark-mid: #252830; --dark-card: #2a2d38;
      --session-col: #7eb8c9; --session-dim: rgba(126,184,201,0.12); --session-border: rgba(126,184,201,0.25);
      --text: #f0ece4; --text-dim: rgba(240,236,228,0.58); --text-muted: rgba(240,236,228,0.3);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.5; }
    .page { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
    .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    .nav-bird { width: 28px; height: 28px; background: var(--session-col); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
    .nav-back { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; border: 1px solid rgba(255,255,255,0.08); border-radius: 5px; padding: 0.4rem 0.75rem; transition: color 0.2s, border-color 0.2s; }
    .nav-back:hover { color: var(--session-col); border-color: var(--session-border); }
    .eyebrow { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--session-col); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .eyebrow::before { content: ''; width: 16px; height: 1px; background: var(--session-col); }
    h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 400; font-style: italic; margin-bottom: 0.6rem; line-height: 1.2; }
    .intro { color: var(--text-dim); font-size: 0.88rem; line-height: 1.75; margin-bottom: 2rem; }

    /* Chart */
    .chart-wrap { background: var(--dark-card); border: 1px solid var(--session-border); border-radius: 20px; padding: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: center; }
    #glow-svg { width: 100%; max-width: 320px; }

    /* Sliders */
    .sliders { display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 2rem; }
    .slider-row { background: var(--dark-card); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 1rem 1.25rem; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .slider-name { font-size: 0.88rem; font-weight: 500; }
    .slider-value { font-family: var(--font-mono); font-size: 1rem; font-weight: 400; color: var(--session-col); min-width: 24px; text-align: right; }
    .slider-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; line-height: 1.5; }
    input[type=range] { width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.08); border-radius: 3px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--session-col); cursor: pointer; border: 3px solid var(--dark-card); box-shadow: 0 0 0 1px var(--session-col); }
    input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--session-col); cursor: pointer; border: 3px solid var(--dark-card); }

    /* Save */
    .save-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.06); }
    .save-status { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--session-col); opacity: 0; transition: opacity 0.3s; }
    .save-status.visible { opacity: 1; }
    .save-actions { display: flex; gap: 0.75rem; }
    .btn-save { background: var(--session-col); border: none; border-radius: 8px; padding: 0.75rem 1.5rem; color: var(--dark); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn-save:hover { opacity: 0.85; }
    .btn-back2 { background: none; border: 1px solid var(--session-border); border-radius: 8px; padding: 0.75rem 1.25rem; color: var(--session-col); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; }
    .btn-back2:hover { background: var(--session-dim); }
    #last-saved-note { transition: opacity 0.3s; }
  </style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <div class="nav-left"><div class="nav-bird">🌅</div>lil' bird · Tool</div>
    <a href="javascript:void(0)" onclick="goBack()" class="nav-back">← Back</a>
  </nav>
  <div class="eyebrow">Session 02 · Vision</div>
  <h1>Glow Map</h1>
  <p class="intro" id="intro-copy">Score each area of your life from 1–10. Where is energy flowing? Where is it dim? The shape that emerges tells you something your words might not.</p>
  <p class="intro" id="compare-note" style="display:none;margin-top:-1rem;font-size:0.8rem;color:var(--session-col);">Faded shape = Session 2 · Solid = today</p>
  <p id="last-saved-note" style="display:none;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.5rem;"></p>

  <div class="chart-wrap">
    <svg id="glow-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="sliders" id="sliders"></div>

  <div class="save-row">
    <span class="save-status" id="save-status">✓ Saved</span>
    <div class="save-actions">
      <a href="javascript:void(0)" onclick="goBack()" class="btn-back2">Back to session</a>
      <button class="btn-save" id="btn-save">Save my map</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  function goBack() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'tool-close' }, '*');
    } else {
      history.back();
    }
  }
</script>
<script>
  const { createClient } = supabase;
  const _urlParams = new URLSearchParams(window.location.search);
  const _token = _urlParams.get('token') ? decodeURIComponent(_urlParams.get('token')) : null;
  const sb = createClient('https://mebqqzbuwkogdxvnihrq.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYnFxemJ1d2tvZ2R4dm5paHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTMzMjAsImV4cCI6MjA5MzQ4OTMyMH0.AzBotw2siyolNEbzd9cp4VT9FjBrGetiZxGOZsOGZVU', {
    auth: { persistSession: false, autoRefreshToken: false }
  });


  const AXES = [
    { key: 'connections',  label: 'Connections',      desc: 'How alive and nourishing are your relationships right now?',           color: '#c4956a' },
    { key: 'spaces',       label: 'Spaces',            desc: 'Does your physical environment support the life you want to live?',     color: '#7eb8c9' },
    { key: 'purpose',      label: 'Passion & Purpose', desc: 'How much of your time is spent on things that genuinely matter to you?', color: '#F5C842' },
    { key: 'resources',    label: 'Resources',         desc: 'Do you have enough — time, money, energy — to live without constant strain?', color: '#9dbf8a' },
    { key: 'wellbeing',    label: 'Energy & Wellbeing',desc: 'How well are you sleeping, moving, resting, and caring for yourself?',  color: '#a89060' },
  ];

  let scores = { connections: 5, spaces: 5, purpose: 5, resources: 5, wellbeing: 5 };
  let compareScores = null;
  let currentUser = null;

  const params = new URLSearchParams(window.location.search);
  const sessionNum = parseInt(params.get('session') || '2');
  const showCompare = sessionNum === 4 || sessionNum === 7;

  function drawChart() {
    const svg = document.getElementById('glow-svg');
    svg.innerHTML = '';
    const cx = 150, cy = 150, r = 110, n = AXES.length;

    // Grid rings
    [0.25, 0.5, 0.75, 1].forEach(pct => {
      const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx', cx); ring.setAttribute('cy', cy);
      ring.setAttribute('r', r * pct);
      ring.setAttribute('fill','none'); ring.setAttribute('stroke','rgba(255,255,255,0.06)'); ring.setAttribute('stroke-width','1');
      svg.appendChild(ring);
    });

    // Axis lines and labels
    AXES.forEach((axis, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
      const x2 = cx + r * Math.cos(angle);
      const y2 = cy + r * Math.sin(angle);
      const lx = cx + (r + 20) * Math.cos(angle);
      const ly = cy + (r + 20) * Math.sin(angle);

      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke','rgba(255,255,255,0.08)'); line.setAttribute('stroke-width','1');
      svg.appendChild(line);

      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', lx); label.setAttribute('y', ly);
      label.setAttribute('text-anchor','middle'); label.setAttribute('dominant-baseline','middle');
      label.setAttribute('fill', axis.color); label.setAttribute('font-size','9');
      label.setAttribute('font-family','DM Mono, monospace');
      label.textContent = axis.label;
      svg.appendChild(label);
    });

    // Filled polygon
    const points = AXES.map((axis, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
      const val   = (scores[axis.key] || 1) / 10;
      return [cx + r * val * Math.cos(angle), cy + r * val * Math.sin(angle)];
    });

    if (compareScores && showCompare) {
      const thenPts = AXES.map((axis, i) => {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const val = (compareScores[axis.key] || 1) / 10;
        return [cx + r * val * Math.cos(angle), cy + r * val * Math.sin(angle)];
      });
      const thenPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      thenPoly.setAttribute('points', thenPts.map(p => p.join(',')).join(' '));
      thenPoly.setAttribute('fill', 'rgba(160,152,128,0.1)');
      thenPoly.setAttribute('stroke', 'rgba(160,152,128,0.55)');
      thenPoly.setAttribute('stroke-width', '1.5');
      thenPoly.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(thenPoly);
    }

    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points', points.map(p => p.join(',')).join(' '));
    poly.setAttribute('fill', 'rgba(126,184,201,0.18)');
    poly.setAttribute('stroke', '#7eb8c9');
    poly.setAttribute('stroke-width', '2');
    poly.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(poly);

    // Dots on vertices
    points.forEach((p, i) => {
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); dot.setAttribute('r', 5);
      dot.setAttribute('fill', AXES[i].color); dot.setAttribute('stroke', '#1e2028'); dot.setAttribute('stroke-width','2');
      svg.appendChild(dot);
    });
  }

  function buildSliders() {
    const container = document.getElementById('sliders');
    AXES.forEach(axis => {
      const row = document.createElement('div');
      row.className = 'slider-row';
      row.innerHTML = `
        <div class="slider-header">
          <span class="slider-name" style="color:${axis.color}">${axis.label}</span>
          <span class="slider-value" id="val-${axis.key}" style="color:${axis.color}">${scores[axis.key]}</span>
        </div>
        <div class="slider-desc">${axis.desc}</div>
        <input type="range" min="1" max="10" value="${scores[axis.key]}" data-key="${axis.key}" style="accent-color:${axis.color}" />`;
      container.appendChild(row);

      row.querySelector('input').addEventListener('input', e => {
        const key = e.target.dataset.key;
        scores[key] = parseInt(e.target.value);
        document.getElementById('val-' + key).textContent = scores[key];
        drawChart();
        autoSave();
      });
    });
  }

  async function autoSave() {
    if (!currentUser) return;
    const toolName = sessionNum === 2 ? 'glow_map_s2' : sessionNum === 4 ? 'glow_map_s4' : 'glow_map_s7';
    try {
      const now = new Date().toISOString(); await sb.from('tool_outputs').upsert({ user_id: currentUser.id, tool_name: toolName, output_data: { scores, saved_at: now }, updated_at: now }, { onConflict: 'user_id,tool_name' });
    } catch {}
  }

  document.getElementById('btn-save').addEventListener('click', async () => {
    await autoSave();
    const s = document.getElementById('save-status');
    s.classList.add('visible');
    if (window.parent !== window) {
      // Send save data to parent so it can update the chat card immediately
      window.parent.postMessage({ type: 'tool-save', toolKey: 'glow-map', data: { scores: { ...scores } } }, '*');
      setTimeout(function() {
        window.parent.postMessage({ type: 'tool-close' }, '*');
      }, 600);
    } else {
      setTimeout(() => s.classList.remove('visible'), 2500);
    }
  });

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const urlUid = params.get('uid');

    // Read ?preload= scores passed from parent (existing scores — skip DB round-trip)
    const preloadParam = params.get('preload');
    let preloadScores = null;
    if (preloadParam) {
      try { preloadScores = JSON.parse(decodeURIComponent(preloadParam)); } catch(e) {}
    }

    if (urlUid) {
      currentUser = { id: urlUid };
      if (_token) { try { await sb.auth.setSession({ access_token: _token, refresh_token: '' }); } catch(e) {} }
    } else {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) currentUser = session.user;
      } catch(e) {}
    }

    if (preloadScores && Object.keys(preloadScores).length) {
      // Use preloaded scores — no DB fetch needed for current scores
      scores = { ...scores, ...preloadScores };
    } else if (currentUser) {
      // Fetch from Supabase
      const toolName = sessionNum === 2 ? 'glow_map_s2' : sessionNum === 4 ? 'glow_map_s4' : 'glow_map_s7';
      try {
        const { data } = await sb.from('tool_outputs').select('output_data').eq('user_id', currentUser.id).eq('tool_name', toolName).maybeSingle();
        if (data?.output_data?.scores) scores = { ...scores, ...data.output_data.scores };
        // Show last completed date
        if (data?.output_data?.saved_at) {
          const d = new Date(data.output_data.saved_at);
          const note = document.getElementById('last-saved-note');
          if (note) {
            note.textContent = 'Last saved ' + d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
            note.style.display = 'block';
          }
        }
      } catch(e) {}
    }

    if (currentUser && showCompare) {
      try {
        const { data: s2 } = await sb.from('tool_outputs').select('output_data').eq('user_id', currentUser.id).eq('tool_name', 'glow_map_s2').maybeSingle();
        if (s2?.output_data?.scores) {
          compareScores = { ...s2.output_data.scores };
          var note = document.getElementById('compare-note');
          if (note) note.style.display = 'block';
          var intro = document.getElementById('intro-copy');
          if (intro) intro.textContent = 'Score where you are now. The faded shape is your Session 2 map — see what brightened or dimmed.';
        }
      } catch(e) {}
    }

    buildSliders();
    drawChart();
  })();
</script>
</body>
</html>
