<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lil' bird</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0806;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Space Mono', monospace;
  }
  .player-wrap { width: 100%; max-width: 720px; padding: 0 20px; }

  .stage {
    width: 100%; height: 300px;
    position: relative; overflow: hidden;
    border-radius: 4px 4px 0 0;
    background: #060402;
  }
  #scene-canvas { position: absolute; top: 0; left: 0; height: 100%; }

  /* Bird sits fixed on stage, scene scrolls behind it */
  .bird-wrap {
    position: absolute;
    bottom: 52px;
    left: 38%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    transition: bottom 0.8s ease;
  }

  /* ── BIRD ANIMATIONS ── */
  /* All use absolute SVG coordinate transforms so origin works correctly */
  @keyframes bodyBob   { 0%,100%{transform:translateY(0)}  50%{transform:translateY(-3px)} }
  @keyframes headBob   { 0%,100%{transform:translateY(0)}  25%{transform:translateY(-2px)} 75%{transform:translateY(1px)} }
  @keyframes eyeBlink  { 0%,88%,100%{transform:scaleY(1)}  94%{transform:scaleY(0.06)} }
  @keyframes tailWag   { 0%,100%{transform:rotate(0deg)}   50%{transform:rotate(12deg)} }
  @keyframes wingFlick { 0%,70%,100%{transform:rotate(0deg)} 85%{transform:rotate(-10deg)} }
  /* Legs: defined as rotate around their hip joint, applied via animateTransform */

  .b-body  { animation: bodyBob  0.36s ease-in-out infinite paused; }
  .b-head  { animation: headBob  0.36s ease-in-out infinite paused; }
  .b-eye   { animation: eyeBlink 3.4s  ease-in-out infinite paused; }
  .b-tail  { animation: tailWag  0.36s ease-in-out infinite paused; transform-box: fill-box; transform-origin: 80% 30%; }
  .b-wing  { animation: wingFlick 1.2s ease-in-out infinite paused; transform-box: fill-box; transform-origin: 20% 40%; }

  /* Legs animated via JS for reliable transform-origin */
  .walking .b-body,
  .walking .b-head,
  .walking .b-eye,
  .walking .b-tail,
  .walking .b-wing { animation-play-state: running; }

  /* Controls — minimal, just play + progress */
  .controls {
    background: rgba(14,10,6,0.97);
    border: 1px solid rgba(196,98,26,0.18);
    border-top: none; border-radius: 0 0 4px 4px;
    padding: 14px 20px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(196,98,26,0.5);
    background: rgba(196,98,26,0.1); color: #e8b84b;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.18s;
  }
  .play-btn:hover { background: rgba(196,98,26,0.22); }
  .play-btn svg { width: 13px; height: 13px; fill: currentColor; }
  .track-info { flex: 1; min-width: 0; }
  .track-name {
    font-family: 'Playfair Display', serif; font-size: 14px; color: #f5e6c8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .track-tag { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(196,98,26,0.55); }
  .time-tag  { font-size: 9px; letter-spacing: 1px; color: rgba(245,230,200,0.25); flex-shrink: 0; }
  .progress-wrap {
    height: 2px; background: rgba(245,230,200,0.07);
    border-radius: 99px; cursor: pointer; position: relative;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg,#8b3a0f,#e8b84b);
    border-radius: 99px; width: 0%; position: relative; transition: width 0.1s linear;
  }
  .progress-fill::after {
    content:''; position:absolute; right:-3px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%;
    background:#e8b84b; box-shadow:0 0 5px rgba(232,184,75,0.7);
  }
</style>
</head>
<body>
<div class="player-wrap">
  <div class="stage" id="stage">
    <canvas id="scene-canvas"></canvas>

    <!-- BIRD: drawn entirely in absolute SVG coords, no translate hacks -->
    <div class="bird-wrap" id="bird-wrap">
      <svg id="bird-svg" width="130" height="115" viewBox="-30 0 160 115" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="45%" cy="55%" r="50%">
            <stop offset="0%" stop-color="#F5CA40"/>
            <stop offset="100%" stop-color="#D4A020"/>
          </radialGradient>
          <radialGradient id="headGrad" cx="45%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#F5CA40"/>
            <stop offset="100%" stop-color="#D4A020"/>
          </radialGradient>
        </defs>

        <!-- ── BACK LEG (behind body) animated via JS ── -->
        <g id="leg-back">
          <!-- upper leg -->
          <line x1="40" y1="82" x2="35" y2="95" stroke="#8B6914" stroke-width="2.2" stroke-linecap="round"/>
          <!-- lower + toes -->
          <line x1="35" y1="95" x2="29" y2="100" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="35" y1="95" x2="34" y2="102" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="35" y1="95" x2="40" y2="100" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- ── BODY (bobs up/down) ── -->
        <g class="b-body">

          <!-- TAIL — left side, points back-left -->
          <g class="b-tail">
            <path d="M22 70 Q10 65 8 56 Q14 62 18 66 Q11 60 12 52 Q17 60 20 65 Z"
                  fill="#C4921A" stroke="#8B5E0A" stroke-width="0.8"/>
          </g>

          <!-- WING — visible on side, folded against body -->
          <g class="b-wing">
            <path d="M30 58 Q22 52 20 62 Q24 68 34 72 Q42 74 50 70 Q44 64 38 62 Q34 60 30 58 Z"
                  fill="#C4921A" stroke="#8B5E0A" stroke-width="0.8"/>
            <!-- feather lines -->
            <line x1="23" y1="60" x2="46" y2="68" stroke="#8B5E0A" stroke-width="0.7" opacity="0.5"/>
            <line x1="22" y1="63" x2="44" y2="71" stroke="#8B5E0A" stroke-width="0.7" opacity="0.4"/>
          </g>

          <!-- BODY — round, fluffy -->
          <ellipse cx="46" cy="72" rx="26" ry="24" fill="url(#bodyGrad)"/>
          <!-- pencil sketch lines on body -->
          <line x1="28" y1="66" x2="24" y2="74" stroke="#B8880E" stroke-width="0.8" opacity="0.5"/>
          <line x1="30" y1="62" x2="26" y2="70" stroke="#B8880E" stroke-width="0.8" opacity="0.4"/>
          <line x1="60" y1="64" x2="66" y2="71" stroke="#B8880E" stroke-width="0.8" opacity="0.4"/>
          <line x1="58" y1="68" x2="64" y2="75" stroke="#B8880E" stroke-width="0.8" opacity="0.3"/>
          <line x1="42" y1="88" x2="44" y2="95" stroke="#B8880E" stroke-width="0.8" opacity="0.4"/>
          <line x1="50" y1="87" x2="52" y2="94" stroke="#B8880E" stroke-width="0.8" opacity="0.3"/>
          <!-- chest highlight -->
          <ellipse cx="47" cy="78" rx="14" ry="12" fill="#F8D860" opacity="0.45"/>
          <!-- body outline -->
          <ellipse cx="46" cy="72" rx="26" ry="24" fill="none" stroke="#5C3D08" stroke-width="1.3" opacity="0.75"/>

          <!-- BINDLE — stick over left shoulder, bundle hangs DOWN from tip -->
          <g id="bindle">
            <!-- Stick: rests on left shoulder (28,58), extends up-left and behind -->
            <line x1="32" y1="60" x2="-8" y2="28" stroke="#7A5018" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Tie / knot where bundle attaches to stick tip -->
            <line x1="-8" y1="28" x2="-8" y2="34" stroke="#8B1A1A" stroke-width="2" stroke-linecap="round"/>
            <!-- Bundle hangs DOWN from stick tip — larger, rounder sack -->
            <!-- White base of bundle -->
            <path d="M-8 34 Q-20 36 -22 48 Q-22 62 -8 66 Q6 66 8 52 Q8 36 -8 34 Z"
                  fill="white" stroke="#CC2222" stroke-width="1.2"/>
            <!-- Red checker squares clipped inside the bundle shape -->
            <!-- Use a clipPath so squares stay inside the bag -->
            <defs>
              <clipPath id="bundleClip">
                <path d="M-8 34 Q-20 36 -22 48 Q-22 62 -8 66 Q6 66 8 52 Q8 36 -8 34 Z"/>
              </clipPath>
            </defs>
            <!-- Checker grid — 8px squares, red on even cells -->
            <g clip-path="url(#bundleClip)">
              <!-- Row 0 (y 34–42) -->
              <rect x="-22" y="34" width="8" height="8" fill="#CC2222"/>
              <rect x="-14" y="34" width="8" height="8" fill="white"/>
              <rect x="-6"  y="34" width="8" height="8" fill="#CC2222"/>
              <rect x="2"   y="34" width="8" height="8" fill="white"/>
              <!-- Row 1 (y 42–50) -->
              <rect x="-22" y="42" width="8" height="8" fill="white"/>
              <rect x="-14" y="42" width="8" height="8" fill="#CC2222"/>
              <rect x="-6"  y="42" width="8" height="8" fill="white"/>
              <rect x="2"   y="42" width="8" height="8" fill="#CC2222"/>
              <!-- Row 2 (y 50–58) -->
              <rect x="-22" y="50" width="8" height="8" fill="#CC2222"/>
              <rect x="-14" y="50" width="8" height="8" fill="white"/>
              <rect x="-6"  y="50" width="8" height="8" fill="#CC2222"/>
              <rect x="2"   y="50" width="8" height="8" fill="white"/>
              <!-- Row 3 (y 58–66) -->
              <rect x="-22" y="58" width="8" height="8" fill="white"/>
              <rect x="-14" y="58" width="8" height="8" fill="#CC2222"/>
              <rect x="-6"  y="58" width="8" height="8" fill="white"/>
              <rect x="2"   y="58" width="8" height="8" fill="#CC2222"/>
            </g>
            <!-- Bundle outline on top of checker -->
            <path d="M-8 34 Q-20 36 -22 48 Q-22 62 -8 66 Q6 66 8 52 Q8 36 -8 34 Z"
                  fill="none" stroke="#CC2222" stroke-width="1.5"/>
            <!-- Gathering / pucker at top where it ties to stick -->
            <path d="M-14 36 Q-8 32 -2 36" fill="none" stroke="#8B1A1A" stroke-width="1.2" stroke-linecap="round"/>
          </g>

          <!-- HEAD (bobs slightly) -->
          <g class="b-head">
            <!-- neck connection -->
            <ellipse cx="60" cy="54" rx="12" ry="10" fill="#D4A020"/>
            <!-- head circle -->
            <circle cx="60" cy="38" r="24" fill="url(#headGrad)"/>
            <!-- head sketch lines -->
            <line x1="44" y1="22" x2="40" y2="29" stroke="#B8880E" stroke-width="0.8" opacity="0.5"/>
            <line x1="72" y1="22" x2="77" y2="28" stroke="#B8880E" stroke-width="0.8" opacity="0.4"/>
            <line x1="42" y1="32" x2="37" y2="39" stroke="#B8880E" stroke-width="0.8" opacity="0.35"/>
            <line x1="76" y1="30" x2="81" y2="37" stroke="#B8880E" stroke-width="0.8" opacity="0.3"/>
            <!-- tufts on top -->
            <path d="M50 16 Q48 7 53 12 Q55 4 60 10 Q62 3 67 9 Q70 5 73 13"
                  stroke="#5C3D08" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.8"/>
            <!-- BEAK — pointing right -->
            <path d="M82 36 L92 32 L82 42 Z" fill="#D4881A"/>
            <line x1="82" y1="36" x2="92" y2="32" stroke="#8B5E0A" stroke-width="0.8"/>
            <line x1="82" y1="39" x2="92" y2="37" stroke="#8B5E0A" stroke-width="0.5" opacity="0.5"/>
            <!-- SINGLE EYE — bird faces right, only near-side eye visible -->
            <g class="b-eye" style="transform-origin: 67px 33px">
              <circle cx="67" cy="33" r="6.5" fill="white"/>
              <circle cx="67" cy="33" r="5.5" fill="#150D04"/>
              <circle cx="69" cy="31" r="2" fill="rgba(255,255,255,0.85)"/>
            </g>
            <!-- head outline -->
            <circle cx="60" cy="38" r="24" fill="none" stroke="#5C3D08" stroke-width="1.3" opacity="0.75"/>
          </g>

        </g><!-- end b-body -->

        <!-- ── FRONT LEG (in front of body) animated via JS ── -->
        <g id="leg-front">
          <line x1="54" y1="82" x2="59" y2="95" stroke="#8B6914" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="59" y1="95" x2="65" y2="100" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="59" y1="95" x2="60" y2="103" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="59" y1="95" x2="54" y2="100" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
        </g>

      </svg>
    </div>
  </div>

  <div class="controls">
    <button class="play-btn" id="play-btn" onclick="togglePlay()">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="progress-wrap" id="prog-wrap" onclick="seekTo(event)" style="flex:1;">
      <div class="progress-fill" id="prog-fill"></div>
    </div>
  </div>
</div>

<script>
// ── AUDIO ──────────────────────────────────────────────────────────────
const audio    = new Audio();
// ↓ Replace with your audio URL or base64 data URI once hosted
audio.src = ''; // e.g. 'https://yourdomain.com/promo.m4a' or a base64 data URI
const progFill = document.getElementById('prog-fill');
const playIcon = document.getElementById('play-icon');
const birdWrap = document.getElementById('bird-wrap');


audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  sceneProgress = audio.currentTime / audio.duration;
  progFill.style.width = (sceneProgress * 100) + '%';
});
audio.addEventListener('ended', () => { stopWalking(); playIcon.innerHTML = PLAY_ICON; });
function seekTo(e){
  if (!audio.duration) return;
  const r = document.getElementById('prog-wrap').getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
}
const PLAY_ICON  = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

function togglePlay(){
  if (!audio.src) return;
  if (audio.paused){ audio.play(); startWalking(); playIcon.innerHTML = PAUSE_ICON; }
  else             { audio.pause(); stopWalking(); playIcon.innerHTML = PLAY_ICON; }
}

// ── LEG ANIMATION (JS-driven rotate around hip) ─────────────────────
let legPhase = 0;
let legRAF   = null;
const legBack  = document.getElementById('leg-back');
const legFront = document.getElementById('leg-front');

// Hip joint coords in SVG space
const HIP_BACK  = { x: 40, y: 82 };
const HIP_FRONT = { x: 54, y: 82 };

function rotateLeg(el, hipX, hipY, angleDeg) {
  el.setAttribute('transform',
    `rotate(${angleDeg}, ${hipX}, ${hipY})`
  );
}

function animateLegs() {
  legPhase += 0.09; // speed
  const maxAngle = 25;
  rotateLeg(legBack,  HIP_BACK.x,  HIP_BACK.y,   Math.sin(legPhase) * maxAngle);
  rotateLeg(legFront, HIP_FRONT.x, HIP_FRONT.y,  Math.sin(legPhase + Math.PI) * maxAngle);
  legRAF = requestAnimationFrame(animateLegs);
}

// ── WALK STATE ────────────────────────────────────────────────────────
let walking = false;
function startWalking(){
  walking = true;
  birdWrap.classList.add('walking');
  if (!legRAF) animateLegs();
  if (!sceneRAF) sceneRAF = requestAnimationFrame(drawLoop);
}
function stopWalking(){
  walking = false;
  birdWrap.classList.remove('walking');
  if (legRAF){ cancelAnimationFrame(legRAF); legRAF = null; }
  // Reset legs to neutral
  rotateLeg(legBack,  HIP_BACK.x,  HIP_BACK.y,  0);
  rotateLeg(legFront, HIP_FRONT.x, HIP_FRONT.y, 0);
}

// ── SCENE CANVAS ─────────────────────────────────────────────────────
const canvas = document.getElementById('scene-canvas');
const ctx    = canvas.getContext('2d');
const stage  = document.getElementById('stage');
let sceneProgress = 0;
let sceneRAF = null;

function resize(){
  canvas.width  = stage.offsetWidth * 3;
  canvas.height = stage.offsetHeight;
  drawScene();
}
window.addEventListener('resize', resize);
resize();

function drawLoop(){
  drawScene();
  if (walking) sceneRAF = requestAnimationFrame(drawLoop);
  else sceneRAF = null;
}

// ─── COLOUR HELPERS ───────────────────────────────────────────────────
function lerp(a, b, t){ t = Math.max(0, Math.min(1, t)); return a + (b - a) * t; }
function lerpRGB(a, b, t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function rgb(c){ return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`; }

// Sky colour progression:
// 0    → near-black forest night
// 0.25 → deep navy blue (pre-dawn)
// 0.55 → rich bright blue (open sky)
// 0.78 → sky still blue but warming at horizon
// 1.0  → golden sunrise, orange-warm
function skyColor(p, stop){
  const keys = [
    { p:0,    top:[22,28,40],   mid:[30,36,50],    bot:[38,44,58]    },
    { p:0.25, top:[18,28,65],   mid:[26,38,85],    bot:[34,50,100]   },
    { p:0.55, top:[25,88,175],  mid:[52,132,198],  bot:[78,158,212]  },
    { p:0.78, top:[45,100,178], mid:[95,150,198],  bot:[135,182,208] },
    { p:1.0,  top:[108,62,20],  mid:[172,108,36],  bot:[208,138,44]  },
  ];
  let i = 0;
  while (i < keys.length - 2 && p > keys[i+1].p) i++;
  const a = keys[i], b = keys[i+1];
  const t = (p - a.p) / (b.p - a.p);
  if (stop === 'top') return rgb(lerpRGB(a.top, b.top, t));
  if (stop === 'mid') return rgb(lerpRGB(a.mid, b.mid, t));
  return rgb(lerpRGB(a.bot, b.bot, t));
}

function rnd(s){ return Math.abs((Math.sin(s*127.1+311.7)*43758.5453)%1); }

// ── DRAW SCENE ────────────────────────────────────────────────────────
function drawScene(){
  const W = canvas.width, H = canvas.height;
  const stageW = stage.offsetWidth;
  const p = sceneProgress;

  ctx.clearRect(0, 0, W, H);

  // How much the world has scrolled left
  const scroll = p * (W - stageW);

  // ── SKY ──
  const skyH = H * 0.62;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, skyH);
  skyGrad.addColorStop(0,    skyColor(p, 'top'));
  skyGrad.addColorStop(0.55, skyColor(p, 'mid'));
  skyGrad.addColorStop(1,    skyColor(p, 'bot'));
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, skyH);

  // Stars (fade out as it brightens)
  if (p < 0.4) {
    const starAlpha = Math.max(0, 1 - p / 0.4);
    ctx.fillStyle = `rgba(255,255,240,${starAlpha * 0.7})`;
    for (let s = 0; s < 60; s++){
      const sx = rnd(s*7+1) * W, sy = rnd(s*7+2) * skyH * 0.7;
      const sr = rnd(s*7+3) * 1.2 + 0.3;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
    }
  }

  // Sun (appears after halfway)
  if (p > 0.5) {
    const sp = Math.min(1, (p - 0.5) / 0.45);
    const sunX = W * 0.76;
    const sunY = H * (0.48 - sp * 0.28);
    const sunR = 14 + sp * 16;
    // glow
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.8);
    glow.addColorStop(0,   `rgba(255,220,90,${sp*0.5})`);
    glow.addColorStop(0.4, `rgba(245,160,40,${sp*0.25})`);
    glow.addColorStop(1,   'rgba(230,100,20,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR*2.8, 0, Math.PI*2); ctx.fill();
    // disc
    ctx.fillStyle = `rgba(255,230,100,${sp*0.92})`;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2); ctx.fill();
    // rays
    ctx.save();
    ctx.globalAlpha = sp * 0.3;
    ctx.strokeStyle = '#F5C842'; ctx.lineWidth = 1.2;
    for (let ri = 0; ri < 10; ri++){
      const a = (ri/10)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(sunX + Math.cos(a)*(sunR+5), sunY + Math.sin(a)*(sunR+5));
      ctx.lineTo(sunX + Math.cos(a)*(sunR+20), sunY + Math.sin(a)*(sunR+20));
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── FAR HILLS (parallax 0.15) ──
  const hillLight = Math.max(0, (p - 0.3) / 0.7);
  const farHills = [
    {x:0.02,w:0.28,h:75}, {x:0.22,w:0.32,h:95},
    {x:0.46,w:0.26,h:68}, {x:0.66,w:0.36,h:88}, {x:0.88,w:0.22,h:58},
  ];
  drawHills(ctx, W, H, H*0.6, scroll*0.15, farHills,
    lerpRGB([22,32,18], [70,95,40], hillLight * 0.55));

  // ── MID HILLS (parallax 0.3) ──
  const midHills = [
    {x:-0.05,w:0.32,h:115}, {x:0.2,w:0.38,h:135},
    {x:0.48,w:0.30,h:100},  {x:0.68,w:0.42,h:145}, {x:0.92,w:0.32,h:110},
  ];
  drawHills(ctx, W, H, H*0.57, scroll*0.3, midHills,
    lerpRGB([16,28,12], [50,72,28], hillLight * 0.65));

  // ── DARK FOREST TREES ──
  const treeAlpha = Math.max(0, 1 - p * 2.5);
  if (treeAlpha > 0.02){
    ctx.save(); ctx.globalAlpha = treeAlpha;
    for (let i = 0; i < 32; i++){
      const tx = rnd(i*3+1) * W * 0.75;
      const th = 80 + rnd(i*3+2) * 110;
      const tw = 20 + rnd(i*3+3) * 30;
      const ty = H * 0.55;
      // trunk
      ctx.fillStyle = `rgb(${30+Math.round(rnd(i)*12)},${20+Math.round(rnd(i)*8)},${12+Math.round(rnd(i)*6)})`;
      ctx.fillRect(tx + tw*0.42, ty, tw*0.16, th*0.4);
      // canopy layers
      for (let l=0; l<3; l++){
        const lw = tw*(1.1-l*0.28), lh = th*(0.38-l*0.05);
        const ly = ty - th*(0.3+l*0.2);
        const d = 22+l*8;
        ctx.fillStyle = `rgb(${d-8},${d+6},${d-10})`;
        ctx.beginPath();
        ctx.moveTo(tx+tw/2, ly);
        ctx.lineTo(tx+tw/2-lw/2, ly+lh);
        ctx.lineTo(tx+tw/2+lw/2, ly+lh);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  // ── CLEARING / ROLLING HILL ──
  const clearProg = Math.max(0, (p - 0.35) / 0.5);
  if (clearProg > 0.01){
    ctx.save(); ctx.globalAlpha = clearProg;
    const hStartX = W * 0.38;
    const hPeakX  = W * 0.80;
    const hPeakY  = H * 0.25;
    const hGrad = ctx.createLinearGradient(0, hPeakY, 0, H);
    hGrad.addColorStop(0, rgb(lerpRGB([20,30,10],[95,130,50],hillLight)));
    hGrad.addColorStop(1, rgb(lerpRGB([14,20,7], [60,88,32], hillLight)));
    ctx.fillStyle = hGrad;
    ctx.beginPath();
    ctx.moveTo(hStartX, H);
    ctx.bezierCurveTo(
      hStartX + (hPeakX-hStartX)*0.3, H*0.70,
      hStartX + (hPeakX-hStartX)*0.65, hPeakY+20,
      hPeakX, hPeakY
    );
    ctx.bezierCurveTo(hPeakX+60, hPeakY-8, W, H*0.35, W, H*0.45);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // grass tufts
    ctx.globalAlpha = clearProg * 0.45;
    ctx.strokeStyle = rgb(lerpRGB([25,40,12],[115,155,60],hillLight));
    ctx.lineWidth = 0.9;
    for (let g=0; g<20; g++){
      const gx = hStartX + rnd(g*11+9)*(W-hStartX);
      const gy = getHillY(gx, hStartX, hPeakX, hPeakY, H);
      const gl = 4+rnd(g*11+10)*8;
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-2,gy-gl); ctx.stroke();
    }
    ctx.restore();
  }

  // ── GROUND ──
  const groundY = H * 0.72;
  const gGrad = ctx.createLinearGradient(0, groundY, 0, H);
  gGrad.addColorStop(0, rgb(lerpRGB([35,28,18],[55,75,28],p*0.75)));
  gGrad.addColorStop(1, rgb(lerpRGB([25,18,12],[35,48,18],p*0.75)));
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, groundY, W, H - groundY);
  // ground line
  ctx.strokeStyle = rgb(lerpRGB([28,22,12],[110,140,55],p*0.55));
  ctx.lineWidth = 1; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.globalAlpha = 1;

  // ── FOREGROUND TREES — placed along the world at fixed world-x positions ──
  // Draw after ground so they sit ON the ground line
  const TREES = [
    // { wx: world-x fraction, type, scale }  — spread across the full world
    { wx:0.04,  type:'pine',   scale:1.0  },
    { wx:0.09,  type:'pine',   scale:0.75 },
    { wx:0.14,  type:'oak',    scale:1.0  },
    { wx:0.20,  type:'pine',   scale:0.85 },
    { wx:0.25,  type:'orange', scale:0.9  },
    { wx:0.31,  type:'oak',    scale:1.1  },
    { wx:0.36,  type:'pine',   scale:0.7  },
    { wx:0.42,  type:'willow', scale:1.0  },
    { wx:0.48,  type:'oak',    scale:0.85 },
    { wx:0.54,  type:'orange', scale:1.0  },
    { wx:0.60,  type:'pine',   scale:0.65 },
    { wx:0.65,  type:'oak',    scale:1.1  },
    { wx:0.72,  type:'willow', scale:0.9  },
    { wx:0.78,  type:'orange', scale:1.0  },
    { wx:0.85,  type:'oak',    scale:0.8  },
    { wx:0.92,  type:'pine',   scale:0.7  },
  ];

  TREES.forEach(tree => {
    const tx = tree.wx * W - scroll;  // full 1:1 parallax — trees are grounded
    if (tx < -120 || tx > W + 50) return; // skip offscreen
    const gY = groundY; // sits on ground line
    drawTree(ctx, tx, gY, tree.type, tree.scale, p, hillLight);
  });

  // ── SCROLL canvas position ──
  canvas.style.left = -scroll + 'px';

  // Lift bird as it climbs the hill
  const hillRise = Math.max(0, (p - 0.55) / 0.45) * 32;
  birdWrap.style.bottom = (52 + hillRise) + 'px';
}

function drawTree(ctx, x, groundY, type, scale, p, hillLight) {
  ctx.save();
  const s = scale;

  if (type === 'pine') {
    // Dark pine — tall triangle silhouette, dark when in forest, greener in clearing
    const h = 90 * s, tw = 32 * s;
    const col = lerpRGB([6,9,4], [28,60,20], hillLight * 0.7);
    // trunk
    ctx.fillStyle = rgb(lerpRGB([14,10,6],[55,38,20],hillLight*0.5));
    ctx.fillRect(x - 4*s, groundY - h*0.28, 8*s, h*0.3);
    // three canopy tiers
    [[1.0,0],[0.75,0.22],[0.52,0.40]].forEach(([wf,yf],i)=>{
      const lw = tw*wf, lh = h*(0.42-i*0.04);
      const ly = groundY - h*(0.28+yf);
      const shade = lerpRGB([col[0]-2+i*3,col[1]-2+i*4,col[2]-1+i*2], col, 0.5);
      ctx.fillStyle = rgb(shade);
      ctx.beginPath();
      ctx.moveTo(x, ly - lh);
      ctx.lineTo(x - lw/2, ly);
      ctx.lineTo(x + lw/2, ly);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgb(lerpRGB([4,6,3],[18,40,12],hillLight*0.6));
      ctx.lineWidth = 0.6; ctx.stroke();
    });

  } else if (type === 'oak') {
    // Broad oak with round canopy
    const h = 75*s, cr = 30*s;
    const cy = groundY - h;
    // trunk
    ctx.fillStyle = rgb(lerpRGB([18,12,7],[70,48,24],hillLight*0.6));
    ctx.beginPath();
    ctx.moveTo(x-7*s, groundY);
    ctx.bezierCurveTo(x-6*s, groundY-h*0.4, x-4*s, groundY-h*0.7, x, cy+cr*0.3);
    ctx.bezierCurveTo(x+4*s, groundY-h*0.7, x+6*s, groundY-h*0.4, x+7*s, groundY);
    ctx.closePath(); ctx.fill();
    // canopy — layered blobs
    const canopyCol = lerpRGB([8,16,6],[38,78,22],hillLight*0.75);
    const darkCol   = lerpRGB([5,10,4],[24,55,14],hillLight*0.75);
    // shadow blob
    ctx.fillStyle = rgb(darkCol);
    ctx.beginPath(); ctx.ellipse(x+8*s, cy+8*s, cr*0.85, cr*0.7, 0.2, 0, Math.PI*2); ctx.fill();
    // main canopy
    ctx.fillStyle = rgb(canopyCol);
    ctx.beginPath(); ctx.ellipse(x, cy, cr, cr*0.82, 0, 0, Math.PI*2); ctx.fill();
    // highlight lobe
    ctx.fillStyle = rgb(lerpRGB([12,22,8],[55,100,30],hillLight*0.75));
    ctx.beginPath(); ctx.ellipse(x-8*s, cy-6*s, cr*0.55, cr*0.45, -0.3, 0, Math.PI*2); ctx.fill();
    // outline
    ctx.strokeStyle = rgb(lerpRGB([4,8,3],[18,45,10],hillLight*0.5));
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(x, cy, cr, cr*0.82, 0, 0, Math.PI*2); ctx.stroke();

  } else if (type === 'orange') {
    // Orange tree — round green canopy with visible orange fruits
    const h = 65*s, cr = 26*s;
    const cy = groundY - h;
    // trunk
    ctx.fillStyle = rgb(lerpRGB([20,13,7],[72,50,26],hillLight*0.6));
    ctx.beginPath();
    ctx.moveTo(x-5*s, groundY);
    ctx.bezierCurveTo(x-4*s, groundY-h*0.5, x-3*s, groundY-h*0.75, x, cy+cr*0.2);
    ctx.bezierCurveTo(x+3*s, groundY-h*0.75, x+4*s, groundY-h*0.5, x+5*s, groundY);
    ctx.closePath(); ctx.fill();
    // leaves — layered greens
    const leafDark = lerpRGB([6,14,5],[22,60,16],hillLight*0.8);
    const leafMid  = lerpRGB([8,18,6],[32,78,20],hillLight*0.8);
    const leafHi   = lerpRGB([10,22,7],[44,95,26],hillLight*0.8);
    ctx.fillStyle = rgb(leafDark);
    ctx.beginPath(); ctx.ellipse(x+5*s,cy+5*s,cr*0.8,cr*0.7,0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = rgb(leafMid);
    ctx.beginPath(); ctx.ellipse(x,cy,cr,cr*0.85,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = rgb(leafHi);
    ctx.beginPath(); ctx.ellipse(x-7*s,cy-5*s,cr*0.55,cr*0.5,-0.2,0,Math.PI*2); ctx.fill();
    // oranges! small circles visible through gaps
    const oranges = [
      {ox:0.4,oy:0.3,r:0.22}, {ox:-0.5,oy:0.1,r:0.2}, {ox:0.1,oy:0.5,r:0.24},
      {ox:-0.2,oy:-0.2,r:0.18},{ox:0.6,oy:-0.1,r:0.2},
    ];
    oranges.forEach(o => {
      const ox = x + o.ox*cr, oy = cy + o.oy*cr, or = o.r*cr;
      // only show if alpha > 0.15 (don't show in pitch dark forest)
      if (hillLight < 0.1) return;
      ctx.fillStyle = `rgba(220,100,20,${Math.min(1,hillLight*1.5)})`;
      ctx.beginPath(); ctx.arc(ox,oy,or,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(160,60,10,${Math.min(1,hillLight*1.5)})`;
      ctx.lineWidth = 0.5; ctx.stroke();
    });
    // outline
    ctx.strokeStyle = rgb(lerpRGB([4,9,3],[16,42,10],hillLight*0.5));
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(x,cy,cr,cr*0.85,0,0,Math.PI*2); ctx.stroke();

  } else if (type === 'willow') {
    // Weeping willow — tall trunk, drooping curtain branches
    const h = 85*s;
    const cy = groundY - h;
    // trunk
    ctx.strokeStyle = rgb(lerpRGB([18,12,7],[65,45,22],hillLight*0.6));
    ctx.lineWidth = 10*s;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, cy+10*s); ctx.stroke();
    ctx.lineWidth = 1;
    // drooping branch curtains
    const curtainCol = lerpRGB([6,14,5],[28,68,18],hillLight*0.75);
    for (let b=-3; b<=3; b++){
      const bx = x + b*12*s;
      const by = cy + 15*s;
      const dropY = groundY - 12*s;
      ctx.strokeStyle = rgb(curtainCol);
      ctx.lineWidth = b===0 ? 2*s : 1.2*s;
      ctx.globalAlpha = 0.75 + (b===0?0.2:0);
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.bezierCurveTo(bx-5*s, by+h*0.2, bx, dropY-10*s, bx, dropY);
      ctx.stroke();
      // secondary wisps
      ctx.lineWidth = 0.7*s;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.moveTo(x + b*6*s, by+10*s);
      ctx.bezierCurveTo(bx+4*s, by+h*0.3, bx+3*s, dropY-5*s, bx+3*s, dropY-2*s);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function getHillY(x, hs, hp, hpy, H){
  if (x < hs) return H*0.72;
  const t = Math.min(1,(x-hs)/(hp-hs));
  return H + (hpy - H)*(3*t*t - 2*t*t*t);
}

function drawHills(ctx, W, H, baseY, para, hills, color){
  hills.forEach(h => {
    const x = h.x*W - para, w = h.w*W;
    ctx.fillStyle = rgb(color);
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.bezierCurveTo(x+w*0.2,baseY-h.h, x+w*0.8,baseY-h.h*0.9, x+w,baseY);
    ctx.lineTo(x+w,H); ctx.lineTo(x,H); ctx.closePath(); ctx.fill();
  });
}
</script>
